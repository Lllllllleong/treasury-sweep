spring.application.name=treasury-sweep

# The PostgreSQL from compose.yaml, for ./gradlew bootRun. Tests and bootTestRun replace it with a Testcontainers
# database (@ServiceConnection), and SPRING_DATASOURCE_* environment variables override it anywhere else.
spring.datasource.url=jdbc:postgresql://localhost:5432/treasury_sweep
spring.datasource.username=treasury_sweep
spring.datasource.password=treasury_sweep

# Actuator over HTTP: health for probes, prometheus for the scrape. Nothing else is exposed.
management.endpoints.web.exposure.include=health,prometheus
